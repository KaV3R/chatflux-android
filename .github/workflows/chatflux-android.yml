# ChatFlux: builds the Android APK (FCM flavour, own Firebase project chatflux-99e20) and publishes it
# as a GitHub Release. Simplified from android-beta-oss.yml (no Fluxer build service / telemetry).
name: ChatFlux Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatflux-android
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          # versionName: YYYY.M.<run number>
          # versionCode: one step of 5000 per 10 minutes. --split-per-abi adds
          # 1000/2000/4000 per ABI, so the universal APK gets +4900 and every
          # APK of a newer build is always above every APK of an older one.
          # (Old builds used minutes since epoch, max ~29.9M; this starts ~46M.)
          BASE=$(( ( $(date -u +%s) / 600 - 2980000 ) * 5000 ))
          echo "name=$(date -u +%Y).$((10#$(date -u +%m))).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$BASE" >> "$GITHUB_OUTPUT"
          echo "universal=$(( BASE + 4900 ))" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-oss-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-oss-

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Android FCM build tree
        run: dart tool/configure_build.dart --profile=android-fcm

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing (run chatflux-signing/set-firebase-secret.ps1)"; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          FIREBASE_OPTIONS_JSON=$(jq -c '
            .project_info as $p
            | (.client[] | select(.client_info.android_client_info.package_name == "hu.catflux.chatflux")) as $c
            | {android: {
                apiKey: $c.api_key[0].current_key,
                appId: $c.client_info.mobilesdk_app_id,
                messagingSenderId: $p.project_number,
                projectId: $p.project_id,
                storageBucket: $p.storage_bucket
              }}' android/app/google-services.json)
          FIREBASE_OPTIONS_JSON="$FIREBASE_OPTIONS_JSON" dart tool/write_firebase_options.dart --environment=stable

      - name: Set up Rust for the native markdown parser
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets

      - name: Resolve unifiedpush_linux to the stub
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/chatflux-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=chatflux
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build APKs
        run: |
          set -euo pipefail
          COMMON="--release --flavor stableFcm --build-name ${{ steps.v.outputs.name }} --dart-define-from-file=tool/dart_defines/stable.json --dart-define=PUSH_PROVIDER=fcm --dart-define=BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flutter build apk $COMMON --build-number ${{ steps.v.outputs.universal }}
          flutter build apk $COMMON --build-number ${{ steps.v.outputs.code }} --split-per-abi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p release
          APK_DIR=build/app/outputs/flutter-apk
          ls -la "$APK_DIR"
          cp "$APK_DIR/app-stablefcm-release.apk" "release/ChatFlux-${{ steps.v.outputs.name }}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="$APK_DIR/app-${abi}-stablefcm-release.apk"
            [ -f "$f" ] && cp "$f" "release/ChatFlux-${{ steps.v.outputs.name }}-${abi}.apk"
          done
          ls -la release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v${{ steps.v.outputs.name }}"
          # Create the release as a draft first, upload with retries (large uploads sometimes time out), then publish.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ChatFlux Android ${{ steps.v.outputs.name }}" \
            --notes "Töltsd le a ChatFlux-${{ steps.v.outputs.name }}.apk fájlt (ez minden telefonon megy). A -arm64-v8a változat kisebb, a legtöbb mai telefonra az kell. Telepítéskor engedélyezni kell az ismeretlen forrásból származó appokat." \
            --draft
          for f in release/*.apk; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::Upload failed: $f"; exit 1
              fi
              echo "Upload failed ($f), retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
